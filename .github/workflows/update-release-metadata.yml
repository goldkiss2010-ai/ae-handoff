name: Update 1.15 release metadata

on:
  push:
    paths:
      - ".github/workflows/update-release-metadata.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update release text
        run: |
          cat > /tmp/release.md <<'EOF'
          AE Handoff 1.15 preview for Windows x64 and macOS Apple Silicon.

          This release adds View Depth Split / Focus Depth for camera-space front/back separation while preserving the FLD1 state-handoff architecture.

          Windows x64 and macOS arm64 builds have been tested in After Effects.

          `FLD1_Asset_Pack_v01.zip` is the shared, host-independent example-data bundle: five 20K particle fields plus a 1M-particle Vortex Ring. The same FLD1 caches can be used by AE Handoff, Fusion Handoff, or another FLD1 reader.

          See the repository documentation for installation, platform notes, and the FLD1 / DCC Handoff architecture.
          EOF
          gh release edit v1.15-preview.1 --repo "$GITHUB_REPOSITORY" --title "AE Handoff 1.15 — Windows / macOS Preview" --notes-file /tmp/release.md
